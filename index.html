<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>GAMELIST</title>

<style>
  :root{--main:#4A90D9;--main-2:#5B8DEF;--sel:#4ade80;--sel-b:#22c55e;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:#fff;color:#333;
  }

  /* ===== 顶部工具栏 ===== */
  #toolbar{
    position:sticky;top:0;z-index:100;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(8px);
    border-bottom:2px solid var(--main);
    padding:10px 16px;
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:10px;
  }
  .stats{display:flex;gap:20px;font-size:15px;color:#555;flex-wrap:wrap;}
  .stats span{display:flex;align-items:center;gap:4px;}
  .stats b{color:var(--main);font-size:18px;}
  #btnShot{
    background:var(--main);color:#fff;border:none;
    padding:8px 18px;border-radius:8px;font-size:14px;
    cursor:pointer;font-weight:700;transition:background .2s;
  }
  #btnShot:hover{background:var(--main-2);}

  /* ===== 主内容 ===== */
  #poster{max-width:1600px;margin:0 auto;padding:16px;}
  .row{display:flex;gap:10px;margin-bottom:14px;align-items:stretch;}
  .year-label{
    flex:0 0 52px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--main),var(--main-2));
    color:#fff;border-radius:10px;
    font-size:18px;font-weight:800;
    writing-mode:vertical-rl;text-orientation:upright;
    padding:10px 0;letter-spacing:3px;
    user-select:none;
  }
  .grid{
    flex:1;min-width:0;
    display:grid;
    grid-template-columns:repeat(15,1fr);
    gap:8px;
  }
  .cell{
    background:#fff;border:1.5px solid #e5e7eb;border-radius:8px;
    padding:10px 4px;text-align:center;font-size:13px;line-height:1.35;
    cursor:pointer;transition:all .12s;
    min-height:64px;display:flex;align-items:center;justify-content:center;
    user-select:none;word-break:break-all;color:#374151;
  }
  .cell:hover{
    border-color:var(--main);transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(74,144,217,.15);
  }
  .cell.selected{
    background:var(--sel);border-color:var(--sel-b);
    color:#064e3b;font-weight:700;
    box-shadow:0 2px 8px rgba(34,197,94,.2);
  }
  .cell.empty{
    border-style:dashed;border-color:#d1d5db;
    color:#9ca3af;cursor:default;pointer-events:none;
  }

  /* ===== 页脚 ===== */
  footer{
    text-align:center;padding:30px 10px 40px;
    color:var(--main);font-weight:700;
    letter-spacing:2px;font-size:16px;
  }

  /* ===== 截图容器 ===== */
  #capture{background:#fff;}

  /* ===== 截图时隐藏工具栏 ===== */
  .screenshotting #toolbar{display:none!important;}

  /* ===== 响应式 ===== */
  @media(max-width:1200px){
    .grid{grid-template-columns:repeat(10,1fr);}
    .cell{font-size:12px;min-height:58px;}
  }
  @media(max-width:768px){
    .year-label{flex:0 0 40px;font-size:15px;padding:6px 0;border-radius:6px;}
    .grid{grid-template-columns:repeat(5,1fr);gap:6px;}
    .cell{font-size:11px;padding:8px 3px;min-height:52px;border-radius:6px;}
    .stats{gap:12px;font-size:13px;}
    .stats b{font-size:15px;}
    #btnShot{padding:7px 14px;font-size:13px;}
    #poster{padding:10px;}
    .row{gap:8px;margin-bottom:10px;}
  }
  @media(max-width:420px){
    .grid{grid-template-columns:repeat(5,1fr);gap:4px;}
    .cell{font-size:10px;padding:6px 2px;min-height:46px;}
    .year-label{flex:0 0 34px;font-size:13px;}
  }
</style>

const poster=document.getElementById('poster');
const statTotal=document.getElementById('statTotal');
const statSel=document.getElementById('statSel');
const statPct=document.getElementById('statPct');
let totalCells=0,selectedCells=0;

function updateStats(){
  statTotal.textContent=totalCells;
  statSel.textContent=selectedCells;
  statPct.textContent=totalCells>0?Math.round(selectedCells/totalCells*100)+'%':'0%';
}

function createCell(name){
  const cell=document.createElement('div');
  cell.className='cell'+(name?'':' empty');
  if(name){
    cell.textContent=name;
    cell.onclick=()=>{
      cell.classList.toggle('selected');
      selectedCells+=cell.classList.contains('selected')?1:-1;
      updateStats();
    };
    totalCells++;
  }else{
    cell.textContent='—';
  }
  return cell;
}

Object.keys(GAMES).forEach(year=>{
  const row=document.createElement('div');row.className='row';
  const label=document.createElement('div');
  label.className='year-label';label.textContent=year;
  const grid=document.createElement('div');grid.className='grid';
  const list=GAMES[year];
  for(let i=0;i<15;i++) grid.appendChild(createCell(list[i]||null));
  row.appendChild(label);row.appendChild(grid);
  poster.appendChild(row);
});

updateStats();

/* 截图：对 #capture 容器完整截图，与滚动位置无关 */
document.getElementById('btnShot').onclick=async()=>{
  const btn=document.getElementById('btnShot');
  const oldText=btn.textContent;
  btn.textContent='\u23F3 截图中...';btn.disabled=true;

  const prevY=window.scrollY;
  window.scrollTo(0,0);                 // 先回顶部，消除视口偏移
  document.body.classList.add('screenshotting');
  await new Promise(r=>setTimeout(r,200)); // 等渲染稳定

  try{
    const target=document.getElementById('capture');
    const rect=target.getBoundingClientRect();
    const fullW=Math.ceil(rect.width);
    const fullH=Math.ceil(target.scrollHeight||rect.height); // 完整高度，与滚动无关

    // 动态限制 scale，防止 canvas 超出浏览器上限导致截图失败
    const MAX_DIM=16000;
    let scale=Math.min(2,window.devicePixelRatio||1.5);
    if(fullH*scale>MAX_DIM)scale=MAX_DIM/fullH;
    if(fullW*scale>MAX_DIM)scale=Math.min(scale,MAX_DIM/fullW);

    const canvas=await html2canvas(target,{
      backgroundColor:'#ffffff',
      scale:scale,
      useCORS:true,logging:false,
      width:fullW,
      height:fullH,
      windowWidth:fullW,
      windowHeight:fullH,
      scrollX:0,scrollY:0,
      x:0,y:0
    });

    const a=document.createElement('a');
    a.download='GAMELIST_'+new Date().toISOString().slice(0,10)+'.png';
    a.href=canvas.toDataURL('image/png');
    document.body.appendChild(a);a.click();a.remove();
  }catch(err){
    alert('截图失败：'+err.message+'\n（截图功能需联网加载 html2canvas 库）');
  }

  document.body.classList.remove('screenshotting');
  window.scrollTo(0,prevY);             // 恢复原滚动位置
  btn.textContent=oldText;btn.disabled=false;
};
</script>
