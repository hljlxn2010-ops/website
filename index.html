<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>饼GN-个人游戏排行</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --main:#4A90D9;
    --main-2:#5B8DEF;
    --pink:#ff9fd0;
    --green:#7ee07a;
    --row-label-w:110px;
    --hei:"SimHei","Heiti SC","黑体","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    color:#333;
    position:relative;
  }
  /* ===== 页面背景层 ===== */
  #pageBg{
    position:fixed;inset:0;z-index:-3;
    background-size:cover;background-position:center;background-repeat:no-repeat;
    background-color:#f4f7fb;
  }
  /* 变暗遮罩（纯黑） */
  #dimMask{position:fixed;inset:0;z-index:-2;background:#000;opacity:0;pointer-events:none;}
  /* 提亮遮罩（纯白） */
  #whiteMask{position:fixed;inset:0;z-index:-1;background:#fff;opacity:0;pointer-events:none;}

  /* ===== 顶部工具栏 ===== */
  #toolbar{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(6px);
    border-bottom:2px solid var(--main);
    padding:8px 12px;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  }
  .btn{
    border:none;cursor:pointer;border-radius:8px;
    background:var(--main);color:#fff;
    padding:7px 14px;font-size:14px;font-weight:700;
    transition:background .2s, transform .1s;
    white-space:nowrap;
  }
  .btn:hover{background:var(--main-2);}
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:#fff;color:var(--main);border:1.5px solid var(--main);}
  .btn.ghost:hover{background:#eef4fc;}
  .toolbar-group{display:flex;align-items:center;gap:6px;font-size:13px;color:#555;}
  input[type=range]{accent-color:var(--main);width:130px;}
  input[type=file]{display:none;}

  /* ===== 主容器 ===== */
  #poster{width:100%;max-width:1600px;margin:0 auto;padding:14px 10px 30px;}
  .row{display:flex;align-items:stretch;gap:8px;margin-bottom:10px;}
  .row-label{
    flex:0 0 var(--row-label-w);
    display:flex;align-items:center;justify-content:center;
    color:#111;border-radius:10px;
    font-family:var(--hei);font-weight:900;
    font-size:clamp(15px,2vw,30px);
    text-align:center;padding:8px;line-height:1.3;letter-spacing:1px;
    user-select:none;cursor:text;
  }
  /* 与参考图一致的分数栏颜色 */
  .row-label.c10  {background:#f28989;}  /* 10分      粉红 */
  .row-label.c9   {background:#f6d84f;}  /* 9.0-9.9   黄 */
  .row-label.c8   {background:#f4ea68;}  /* 8.0-8.9   浅黄 */
  .row-label.c7   {background:#aade3e;}  /* 7.0-7.9   黄绿 */
  .row-label.c6   {background:#3ecb62;}  /* 6.0-6.9   绿 */
  .row-label.c5   {background:#a5e3f5;}  /* 5.0-5.9   浅蓝 */
  .row-label.c0   {background:#bdbdbd;}  /* 低于5.0   灰 */
  .row-body{flex:1;min-width:0;}
  .grid{
    display:grid;
    grid-template-columns:repeat(11,1fr);
    gap:6px;
  }

  /* ===== 单个游戏卡片 ===== */
  .cell{
    position:relative;
    background:#fff;border-radius:6px;overflow:hidden;
    border:1px solid #dbe6f3;
    box-shadow:0 1px 3px rgba(60,100,160,.12);
    display:flex;flex-direction:column;
  }
  .img-wrap{
    position:relative;flex:1;min-height:0;
    aspect-ratio:3/4;
    background:#e9eef5;
    display:flex;align-items:center;justify-content:center;
  }
  .img-wrap img{width:100%;height:100%;object-fit:contain;display:block;}
  .img-wrap .placeholder{
    font-size:26px;color:#b9c7d9;user-select:none;pointer-events:none;
  }
  .tag{
    position:absolute;z-index:3;
    font-family:var(--hei);font-weight:900;color:#111;
    font-size:clamp(9px,1vw,15px);
    padding:1px 6px;border-radius:3px;
    min-width:22px;min-height:14px;text-align:center;
    line-height:1.4;cursor:text;outline:none;
    background:transparent;user-select:text;
  }
  .tag:focus{box-shadow:0 0 0 2px var(--main);}
  .tag.tl{top:4px;left:4px;}
  .tag.tr{top:4px;right:4px;}
  .tag.bl{bottom:4px;left:4px;}
  .tag.br{bottom:4px;right:4px;}
  .tag.pink:not(:empty){background:var(--pink);}
  .tag.green:not(:empty){background:var(--green);}
  .tag[contenteditable]{white-space:nowrap;overflow:hidden;}

  .game-name{
    font-family:var(--hei);font-weight:900;
    font-size:clamp(9px,1vw,15px);
    text-align:center;color:#111;
    padding:4px 2px;line-height:1.3;
    background:#fff;min-height:1.6em;
    cursor:text;outline:none;word-break:break-all;
  }
  .game-name:focus{box-shadow:inset 0 0 0 2px var(--main);}

  .cell .tools{
    display:flex;justify-content:center;gap:4px;
    padding:2px 2px 4px;background:#f2f6fb;
  }
  .cell .tools button{
    border:none;background:var(--main);color:#fff;
    font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px;cursor:pointer;
  }
  .cell .tools button.del{background:#e05a5a;}

  .add-cell{
    border:2px dashed #b9cbe4;border-radius:6px;
    background:rgba(255,255,255,.6);
    color:var(--main);font-size:24px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    aspect-ratio:3/4;align-self:start;width:100%;
  }
  .add-cell:hover{background:#eaf2fc;}

  .row-actions{display:flex;gap:6px;margin-top:6px;justify-content:flex-end;}
  .row-actions button{
    border:1.5px solid var(--main);background:#fff;color:var(--main);
    font-size:12px;font-weight:700;border-radius:6px;padding:3px 10px;cursor:pointer;
  }
  .row-actions button.del{border-color:#e05a5a;color:#e05a5a;}

  footer{
    text-align:center;padding:22px 10px 30px;
    color:var(--main);font-family:var(--hei);font-weight:900;
    letter-spacing:2px;font-size:15px;
  }
  footer span{outline:none;cursor:text;}

  /* ===== 截图时的清理 ===== */
  .screenshotting .tools, .screenshotting .row-actions,
  .screenshotting #toolbar, .screenshotting .add-cell{display:none !important;}

  /* ===== 响应式 ===== */
  @media (max-width:768px){
    :root{--row-label-w:64px;}
    .row-label{font-size:13px;letter-spacing:0;padding:4px;}
    .grid{grid-template-columns:repeat(11,1fr);gap:3px;}
    .tag{padding:0 3px;font-size:8px;}
    .game-name{font-size:8px;padding:2px 1px;}
    .cell .tools button{font-size:9px;padding:1px 4px;}
    #toolbar{padding:6px 8px;gap:6px;}
    .btn{padding:6px 10px;font-size:13px;}
  }
  @media (max-width:420px){
    .grid{gap:2px;}
    .tag{font-size:7px;min-width:14px;}
    .game-name{font-size:7px;}
    .toolbar-group span.lbl{display:none;}
  }
</style>
</head>
<body>

<div id="pageBg"></div>
<div id="dimMask"></div>
<div id="whiteMask"></div>

<!-- ===== 工具栏 ===== -->
<div id="toolbar">
  <button class="btn" id="btnShot">📸 截图保存</button>
  <button class="btn ghost" id="btnAddRow">➕ 添加一行</button>
  <button class="btn ghost" id="btnBg">🖼️ 上传页面背景</button>
  <div class="toolbar-group">
    <span class="lbl">背景亮度</span>
    <input type="range" id="bgBright" min="0" max="200" value="100">
    <span id="brightVal">100</span>
  </div>
  <div class="toolbar-group">
    <span class="lbl">截图时隐藏工具栏</span>
    <input type="checkbox" id="hideBar" checked>
  </div>
</div>

<div id="poster"></div>

<footer>© <span id="footerText" contenteditable="true">饼GN-个人游戏排行</span></footer>

<input type="file" id="bgFile" accept="image/*">
<input type="file" id="cellFile" accept="image/*">

<script>
/* ================= 数据与构建 ================= */
/* 与参考图一致的行：标签 + 颜色 + 卡片数量 */
const DEFAULT_ROWS = [
  {label:"饼GN\n10分",   color:"c10", count:7},
  {label:"饼GN\n9.0-9.9", color:"c9",  count:33},
  {label:"饼GN\n8.0-8.9", color:"c8",  count:44},
  {label:"饼GN\n7.0-7.9", color:"c7",  count:36},
  {label:"饼GN\n6.0-6.9", color:"c6",  count:14},
  {label:"饼GN\n5.0-5.9", color:"c5",  count:5},
  {label:"饼GN\n低于5.0", color:"c0",  count:1},
];
const poster = document.getElementById('poster');
const cellFileInput = document.getElementById('cellFile');
let currentCell = null;

function createCell(){
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = `
    <div class="img-wrap">
      <span class="placeholder">＋</span>
      <div class="tag green tl" contenteditable="true"></div>
      <div class="tag green tr" contenteditable="true"></div>
      <div class="tag pink bl" contenteditable="true"></div>
      <div class="tag pink br" contenteditable="true"></div>
    </div>
    <div class="game-name" contenteditable="true"></div>
    <div class="tools">
      <button class="up-img">传图</button>
      <button class="del">删</button>
    </div>`;
  cell.querySelector('.up-img').onclick = () => { currentCell = cell; cellFileInput.value=''; cellFileInput.click(); };
  cell.querySelector('.del').onclick = () => { cell.remove(); };
  return cell;
}

function createRow(label, colorClass, count){
  const row = document.createElement('div');
  row.className = 'row';
  const lab = document.createElement('div');
  lab.className = 'row-label ' + colorClass;
  lab.contentEditable = true;
  lab.innerText = label;           /* 支持 \n 换行 */
  const body = document.createElement('div');
  body.className = 'row-body';
  const grid = document.createElement('div');
  grid.className = 'grid';
  for(let i=0;i<count;i++) grid.appendChild(createCell());
  const add = document.createElement('div');
  add.className = 'add-cell';
  add.textContent = '＋';
  add.title = '添加一个';
  add.onclick = () => grid.insertBefore(createCell(), add);
  grid.appendChild(add);
  body.appendChild(grid);
  const acts = document.createElement('div');
  acts.className = 'row-actions';
  acts.innerHTML = `<button class="add5">+5 个</button><button class="del">删除本行</button>`;
  acts.querySelector('.add5').onclick = () => { for(let i=0;i<5;i++) grid.insertBefore(createCell(), add); };
  acts.querySelector('.del').onclick = () => { if(confirm('删除这一行？')) row.remove(); };
  body.appendChild(acts);
  row.appendChild(lab); row.appendChild(body);
  return row;
}

DEFAULT_ROWS.forEach(r => poster.appendChild(createRow(r.label, r.color, r.count)));
document.getElementById('btnAddRow').onclick = () =>
  poster.appendChild(createRow('新一行', 'c5', 11));

/* ================= 图片上传（显示完整尺寸） ================= */
cellFileInput.onchange = e => {
  const f = e.target.files[0];
  if(!f || !currentCell) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const wrap = currentCell.querySelector('.img-wrap');
    let img = wrap.querySelector('img');
    if(!img){
      wrap.querySelector('.placeholder').remove();
      img = document.createElement('img');
      wrap.prepend(img);
    }
    img.src = ev.target.result;   /* object-fit:contain 保证完整显示 */
  };
  reader.readAsDataURL(f);
};

/* ================= 页面背景 + 亮度（0=纯黑, 100=原图, 200=纯白） ================= */
const bgInput = document.getElementById('bgFile');
const pageBg = document.getElementById('pageBg');
const dimMask = document.getElementById('dimMask');
const whiteMask = document.getElementById('whiteMask');
document.getElementById('btnBg').onclick = () => bgInput.click();
bgInput.onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ev => pageBg.style.backgroundImage = `url(${ev.target.result})`;
  reader.readAsDataURL(f);
};
const brightSlider = document.getElementById('bgBright');
const brightVal = document.getElementById('brightVal');
function applyBrightness(v){
  brightVal.textContent = v;
  if(v <= 100){
    dimMask.style.opacity = (1 - v/100).toFixed(3);
    whiteMask.style.opacity = 0;
  }else{
    dimMask.style.opacity = 0;
    whiteMask.style.opacity = ((v - 100)/100).toFixed(3);
  }
}
brightSlider.oninput = e => applyBrightness(+e.target.value);
applyBrightness(100);

/* ================= 防止粘贴带格式 ================= */
document.addEventListener('paste', e => {
  const t = e.target;
  if(t && t.matches && t.matches('[contenteditable]')){
    e.preventDefault();
    document.execCommand('insertText', false, (e.clipboardData||window.clipboardData).getData('text'));
  }
});

/* ================= 截图功能 ================= */
document.getElementById('btnShot').onclick = async () => {
  const hideBar = document.getElementById('hideBar').checked;
  if(hideBar) document.body.classList.add('screenshotting');
  await new Promise(r => setTimeout(r, 80));
  try{
    const canvas = await html2canvas(document.body, {
      backgroundColor:null,
      scale: Math.min(2, window.devicePixelRatio || 1.5),
      useCORS:true, logging:false,
      windowWidth: document.documentElement.scrollWidth,
      windowHeight: document.documentElement.scrollHeight
    });
    const a = document.createElement('a');
    a.download = '饼GN排行_' + new Date().toISOString().slice(0,10) + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }catch(err){
    alert('截图失败：' + err.message + '\n（截图功能需联网加载 html2canvas 库）');
  }
  document.body.classList.remove('screenshotting');
};
</script>
</body>
</html>
